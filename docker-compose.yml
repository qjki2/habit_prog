  #  ports:
   #   - "5173:5173"
  #  volumes:
  #    - ./frontend:/app # Hot-reloading per sviluppo
  #    - /app/node_modules
   # environment:
  #    VITE_API_URL: "http://localhost:5000"
  #  depends_on:
   #   - backend

volumes:
  postgres_data: