<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Test Habit Tracker</title>
    <style>
        body { font-family: sans-serif; max-width: 450px; margin: 40px auto; }
        input, button { display: block; width: 100%; margin: 8px 0; padding: 10px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { background: #eee; margin: 5px 0; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>Test Habit Tracker</h2>

    <div>
        <input type="text" id="name" placeholder="Nome abitudine (es. Bere Acqua)" required>
        <input type="text" id="description" placeholder="Descrizione">
        <button onclick="createHabit()">Aggiungi Abitudine</button>
    </div>

    <h3>Abitudini Salvate:</h3>
    <ul id="habit-list"></ul>

    <script>
        const API_URL = "http://localhost:5001";

        async function createHabit() {
            const name = document.getElementById('name').value;
            const description = document.getElementById('description').value;

            if (!name) return alert("Inserisci un nome!");

            try {
                const response = await fetch(`${API_URL}/habits`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: name, description: description })
                });

                if (response.ok) {
                    document.getElementById('name').value = '';
                    document.getElementById('description').value = '';
                    loadHabits();
                } else {
                    const err = await response.json();
                    alert("Errore: " + (err.error || response.statusText));
                }
            } catch (error) {
                console.error("Errore di connessione:", error);
                alert("Impossibile connettersi al backend!");
            }
        }

        async function loadHabits() {
            try {
                const response = await fetch(`${API_URL}/habits`);
                const habits = await response.json();
                
                const list = document.getElementById('habit-list');
                list.innerHTML = '';
                
                habits.forEach(h => {
                    const li = document.createElement('li');
                    li.textContent = `📌 ${h.name} - ${h.description || 'Nessuna descrizione'}`;
                    list.appendChild(li);
                });
            } catch (error) {
                console.error("Errore nel caricamento:", error);
            }
        }

        loadHabits();
    </script>
</body>
</html>
